<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>3Dto2DVerify | 검사 이력</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="admin-page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="3Dto2DVerify 홈">
        <span class="brand-mark">3D</span>
        <span>
          <strong>3Dto2DVerify</strong>
          <small>History Console</small>
        </span>
      </a>
      <nav class="nav">
        <a href="/">홈</a>
        <a href="/admin/contacts">문의 관리</a>
        <a href="/admin/history">검사 이력</a>
      </nav>
      <div class="status-pill" id="adminStatus">토큰 필요</div>
    </header>

    <main class="admin-shell">
      <section class="admin-toolbar" aria-label="이력 조회 도구">
        <label>
          관리자 토큰
          <input id="adminToken" type="password" autocomplete="off" />
        </label>
        <label>
          표시 수
          <input id="historyLimit" type="number" min="1" max="1000" value="100" />
        </label>
        <button type="button" class="primary-button" id="loadHistory">이력 불러오기</button>
        <p class="form-note" id="adminResult" aria-live="polite"></p>
      </section>

      <section class="contact-table-wrap" aria-label="저장된 검사 이력 목록">
        <table class="contact-table">
          <thead>
            <tr>
              <th>시간</th>
              <th>Part ID</th>
              <th>판정</th>
              <th>요약 (P/W/F)</th>
              <th>ID</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="5">이력을 불러와 주세요.</td></tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="/static/history.js"></script>
  </body>
</html>
